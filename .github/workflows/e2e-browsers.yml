name: Cross-browser end-to-end

# Firefox and WebKit are not part of the pull request check, which only runs Chromium and the
# mobile profile. They run here every night and on demand, and a failure opens one issue.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Firefox and WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e -- --project=firefox --project=webkit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Open an issue unless one is already open
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Cross-browser end-to-end run failed
        run: |
          open=$(gh issue list --state open --search "$TITLE in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" \
              --body "Firefox or WebKit failed on main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
