name: Lighthouse

# Runs when Vercel reports a successful preview deployment.
on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.environment_url }}/
          configPath: lighthouserc.json
          uploadArtifacts: true
      - uses: actions/github-script@v9
        if: always() && steps.lhci.outputs.manifest
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST);
            const links = JSON.parse(process.env.LINKS);
            const pct = (value) => Math.round(value * 100);
            const rows = manifest
              .filter((run) => run.isRepresentativeRun)
              .map((run) => {
                const s = run.summary;
                const link = links[run.url];
                return `| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} | ${link ? `[report](${link})` : ""} |`;
              });
            const body = [
              "### Lighthouse",
              `Preview: ${process.env.PREVIEW_URL}`,
              "",
              "| URL | Performance | Accessibility | Best practices | SEO | Report |",
              "| --- | --- | --- | --- | --- | --- |",
              ...rows,
            ].join("\n");
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.payload.deployment.sha,
            });
            const pr = prs[0];
            if (!pr) return;
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
