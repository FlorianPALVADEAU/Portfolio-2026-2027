name: Bug
description: Something behaves incorrectly
labels: ["type:fix"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, viewport, locale, theme.
